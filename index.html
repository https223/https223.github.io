<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Task Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #222;
        }

        header {
            background: #142b50;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 950px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        h2 {
            margin: 0;
            color: #142b50;
        }

        .user-badge {
            background: #eef3fa;
            color: #142b50;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            word-break: break-all;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tab-btn {
            border: 1px solid #142b50;
            background: white;
            color: #142b50;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #142b50;
            color: white;
        }

        .wall-frame {
            display: none;
            width: 100%;
            height: 760px;
            border: 0;
            max-width: 100%;
            border-radius: 12px;
        }

        .wall-frame.active {
            display: block;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>Online Task Hub</h1>
    <p>Complete tasks and earn rewards</p>
</header>

<main>

    <section class="card">

        <div class="top-bar">
            <h2>Available Tasks</h2>
            <div class="user-badge">User ID: <span id="user-id-display">Loading...</span></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-target="octoclix">OctoClix</button>
            <button class="tab-btn" data-target="offerzono">OfferZono</button>
        </div>

        <iframe
            id="octoclix"
            class="wall-frame active"
            title="OctoClix Offerwall"
            src="about:blank"
            width="100%"
            height="760"
            allow="identity-credentials-get; clipboard-write"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-top-navigation-by-user-activation">
        </iframe>

        <iframe
            id="offerzono"
            class="wall-frame"
            title="OfferZono Offerwall"
            src="about:blank"
            width="100%"
            height="760"
            allow="identity-credentials-get; clipboard-write"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-top-navigation-by-user-activation">
        </iframe>

    </section>

</main>

<footer>
    Online Task Hub
</footer>

<script>
    const OCTOCLIX_SITE_KEY = "TTGnMr55FuvgfuXqFWy7c86A";
    const OFFERZONO_KEY = "06c4d5027d1d3efe3d237b01dd7d1d1c";

    let userID = localStorage.getItem("taskhub_user_id") || localStorage.getItem("octoclix_user_id");
    if (!userID) {
        userID = "guest_" + crypto.randomUUID();
    }
    localStorage.setItem("taskhub_user_id", userID);
    document.getElementById("user-id-display").textContent = userID;

    const octoclixURL =
        "https://octoclix.com/ow/" +
        encodeURIComponent(OCTOCLIX_SITE_KEY) +
        "/" +
        encodeURIComponent(userID);

    const offerzonoURL =
        "https://offerzono.com/offerwall?key=" +
        encodeURIComponent(OFFERZONO_KEY) +
        "&userid=" +
        encodeURIComponent(userID);

    document.getElementById("octoclix").src = octoclixURL;
    document.getElementById("offerzono").src = offerzonoURL;

    const tabButtons = document.querySelectorAll(".tab-btn");
    const frames = document.querySelectorAll(".wall-frame");

    tabButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
            const targetId = btn.getAttribute("data-target");
            tabButtons.forEach((b) => b.classList.remove("active"));
            frames.forEach((f) => f.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById(targetId).classList.add("active");
        });
    });
</script>

</body>
</html>
