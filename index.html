<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Task Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #222;
}

header {
    background: #142b50;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

main {
    max-width: 950px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000012;
}

h2 {
    color: #142b50;
}

iframe {
    width: 100%;
    height: 800px;
    border: 0;
    border-radius: 10px;
    max-width: 900px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #666;
}
</style>
</head>

<body>

<header>
    <h1>Online Task Hub</h1>
    <p>Complete tasks and earn rewards</p>
</header>

<main>
    <section class="card">

        <h2>Available Tasks</h2>

        <iframe
            id="octoclix-wall"
            title="OctoClix Offerwall"
            width="100%"
            height="800"
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
            loading="lazy">
        </iframe>

    </section>
</main>

<footer>
    Online Task Hub
</footer>

<script>
(function() {

    const SITE_KEY = "TTGnMr55FuvgfuXqFWy7c86A";

    let userId = localStorage.getItem("octoclix_user_id");

    if (!userId) {
        userId = "guest_" + (
            window.crypto && crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2)
        );

        localStorage.setItem("octoclix_user_id", userId);
    }

    const wallURL =
        "https://octoclix.com/ow/" +
        encodeURIComponent(SITE_KEY) + "/" +
        encodeURIComponent(userId);

    document.getElementById("octoclix-wall").src = wallURL;

})();
</script>

</body>
</html>
