<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Task Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #222;
        }

        header {
            background: #142b50;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 950px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        h2 {
            color: #142b50;
        }

        iframe {
            display: block;
            width: 100%;
            height: 720px;
            border: 0;
            max-width: 900px;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>Online Task Hub</h1>
    <p>Complete tasks and earn rewards</p>
</header>

<main>

    <section class="card">

        <h2>Available Tasks</h2>

        <iframe
            id="octoclix"
            title="OctoClix Offerwall"
            src="about:blank"
            width="100%"
            height="720"
            style="border:0;max-width:900px;border-radius:12px;"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox">
        </iframe>

    </section>

</main>

<footer>
    Online Task Hub
</footer>

<script>

    // Your OctoClix Site Key
    const SITE_KEY = "TTGnMr55FuvgfuXqFWy7c86A";

    // Create a stable test user ID
    let userID = localStorage.getItem("octoclix_user_id");

    if (!userID) {
        userID = "guest_" + crypto.randomUUID();

        localStorage.setItem("octoclix_user_id", userID);
    }

    // Official OctoClix Offerwall URL
    const offerwallURL =
        "https://octoclix.com/ow/" +
        encodeURIComponent(SITE_KEY) +
        "/" +
        encodeURIComponent(userID);

    // Load Offerwall
    document.getElementById("octoclix").src = offerwallURL;

</script>

</body>
</html>
